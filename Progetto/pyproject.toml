[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dffa"
version = "0.1.0"
description = "Deepfake Forensics & Attribution multi-stream con explainability VLM"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Giulio Pedicone" }]
license = { text = "MIT" }
dependencies = [
    "torch>=2.1",
    "torchvision>=0.16",
    "numpy>=1.24",
    "pillow>=10.0",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "tqdm>=4.66",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
vlm = [
    "transformers>=4.49",
    "accelerate>=0.34",
    "bitsandbytes>=0.43",
    "qwen-vl-utils>=0.0.8",
    "sentencepiece>=0.1.99",
]

[tool.setuptools.packages.find]
include = ["dffa*"]
